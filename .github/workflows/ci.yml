name: Phone Store CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  ci:
    name: CI - build and smoke tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      PORT: 5000
      MONGODB_URI: mongodb://localhost:27017/phone_store_test
      JWT_SECRET: test-secret-1234567890
      CLIENT_ORIGINS: http://localhost:5500,http://127.0.0.1:5500
      ADMIN_EMAIL: admin@quannguyenmobile.store
      ADMIN_PASSWORD: QuanNguyenMobileStore123!
      SERVE_FRONTEND: "true"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Install and build React frontend
        run: |
          npm ci --prefix ../frontend
          npm run build --prefix ../frontend

      - name: Validate backend syntax
        run: node --check server.js

      - name: Start backend server
        run: |
          npm start > backend.log 2>&1 &
          echo $! > backend.pid
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/api/health > /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "Backend failed to start"
            cat backend.log
            exit 1
          fi
          curl -fsS http://localhost:5000/api/health

      - name: Run backend API smoke tests
        run: |
          LOGIN_RESULT=$(curl -fsS -X POST http://localhost:5000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@quannguyenmobile.store","password":"QuanNguyenMobileStore123!"}')
          TOKEN=$(printf '%s' "$LOGIN_RESULT" | python3 -c "import sys, json; print(json.load(sys.stdin)['token'])")
          curl -fsS -X POST http://localhost:5000/api/products/seed \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}'
          curl -fsS "http://localhost:5000/api/products?page=1&limit=3" \
            | python3 -c "import sys, json; data=json.load(sys.stdin); assert data['products']; assert data['pagination']['total'] > 0"
          curl -fsS -H "Authorization: Bearer $TOKEN" http://localhost:5000/api/admin/overview

      - name: Run React frontend smoke tests
        run: |
          for route in / /admin /about /product/sample; do
            curl -fsS "http://localhost:5000$route" | grep -q 'id="root"'
          done
